  <rect x="1280" y="28" width="210" height="82" rx="7" fill="#f8f7ff" stroke="#5b5fc7" stroke-width="2" /><ellipse cx="1298" cy="55" rx="9" ry="3" fill="none" stroke="#5b5fc7" stroke-width="2" /><path d="M1289 55v14c0 4 18 4 18 0V55M1289 62c0 4 18 4 18 0" fill="none" stroke="#5b5fc7" stroke-width="2" /><text x="1330" y="62" class="title">Online Eval Results</text><text x="1330" y="84" class="copy">Outcomes + metrics</text>
  <rect x="1088" y="336" width="285" height="144" rx="8" fill="#fff0ec" stroke="#c4314b" stroke-width="2" /><text x="1110" y="370" class="title">Eval Gate</text><text x="1110" y="395" class="copy">Held-out regression dataset</text><text x="1110" y="416" class="copy">Candidate versus baseline</text><text x="1110" y="437" class="copy">Policy, quality, and cost thresholds</text>
  <rect x="1088" y="560" width="285" height="126" rx="8" fill="#e8f5e8" stroke="#107c10" stroke-width="2" /><text x="1110" y="594" class="title">Optimized Tuned Agent</text><text x="1110" y="618" class="copy">Updated instruction policy applied</text><text x="1110" y="640" class="copy">Ready for enterprise rollout</text>

  <path d="M410 206V354" fill="none" stroke="#0078d4" stroke-width="2" marker-end="url(#blue)" /><text x="284" y="245" text-anchor="middle" class="label">eval run + optimized agent config</text><text x="531" y="245" text-anchor="middle" class="label">trace + state</text><path d="M458 354V206" fill="none" stroke="#0078d4" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#blue)" />
