    <circle r="5" fill="#107c10" opacity="0"><animateMotion path="M435 594V480" dur="11s" keyPoints="0;1;1" keyTimes="0;.07;1" begin="5.5s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.015;.085;1" dur="11s" begin="5.5s" repeatCount="indefinite" /></circle>
    <circle r="5" fill="#0078d4" opacity="0"><animateMotion path="M458 354V206" dur="11s" keyPoints="0;1;1" keyTimes="0;.07;1" begin="6.6s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.015;.085;1" dur="11s" begin="6.6s" repeatCount="indefinite" /></circle>
