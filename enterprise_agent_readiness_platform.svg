  <path d="M773 480V594" fill="none" stroke="#b05a00" stroke-width="2" marker-end="url(#amber)" /><path d="M821 594V480" fill="none" stroke="#b05a00" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#amber)" />
