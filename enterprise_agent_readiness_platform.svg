  <path d="M1230 480V560" fill="none" stroke="#107c10" stroke-width="2" marker-end="url(#green)" /><text x="1272" y="521" text-anchor="middle" class="label">approved</text><path d="M1373 623H1420" fill="none" stroke="#107c10" stroke-width="2" marker-end="url(#green)" /><text x="1411" y="607" text-anchor="middle" class="label">rollout</text>
  <path d="M1137 336V150H1137V110" fill="none" stroke="#c4314b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#red)" /><text x="1207" y="227" text-anchor="middle" class="label">offline eval results</text><path d="M1050 70H1012" fill="none" stroke="#0078d4" stroke-width="2" marker-end="url(#blue)" /><path d="M1385 110V132H1012" fill="none" stroke="#5b5fc7" stroke-width="2" marker-end="url(#violet)" />

