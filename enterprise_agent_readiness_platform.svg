<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -64 1510 904" role="img" aria-labelledby="title description">
  <title id="title">Enterprise Agent Readiness Platform</title>
  <desc id="description">Enterprise Digital Twins for Agent Readiness and Continuous Optimization.</desc>
  <style>
    .domain { font: 700 12px sans-serif; fill: #17212b; }
    .title { font: 700 13px sans-serif; fill: #17212b; }
    .copy { font: 10px sans-serif; fill: #5d6875; }
    .label { font: 10px monospace; fill: #334155; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
    @media (prefers-reduced-motion: reduce) { .signal { display: none; } }
  </style>
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce2e8" /></pattern>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#0078d4" /></marker>
    <marker id="violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#5b5fc7" /></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#107c10" /></marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b05a00" /></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#c4314b" /></marker>
  </defs>
  <rect x="0" y="-64" width="1510" height="904" fill="#fff" />
  <rect x="0" y="-64" width="1510" height="904" fill="url(#dots)" />

  <text x="148" y="-38" class="domain">ENTERPRISE AGENT READINESS PLATFORM</text>
  <text x="148" y="-16" class="copy">Enterprise Digital Twins for Agent Readiness and Continuous Optimization</text>

  <rect x="148" y="16" width="864" height="190" rx="8" fill="#f4f9fe" stroke="#0078d4" stroke-width="2" />
  <text x="174" y="48" class="domain">EDT SERVER: EVALUATION + OPTIMIZATION</text>
  <rect x="174" y="76" width="225" height="110" rx="6" fill="#fff" stroke="#9dc8ea" /><text x="192" y="108" class="title">EDT Client Transport</text><text x="192" y="130" class="copy">Universal SDK API</text><text x="192" y="148" class="copy">Run and configuration control</text>
  <rect x="415" y="62" width="275" height="132" rx="6" fill="#fff" stroke="#9dc8ea" stroke-width="2" /><text x="433" y="85" class="title">Evaluator + Reward Model</text>
  <rect x="433" y="96" width="239" height="25" rx="4" fill="#fff0cf" stroke="#b05a00" stroke-width="1.5" /><text x="445" y="113" class="title">POLICY-BASED EVALUATORS</text>
  <rect x="433" y="130" width="114" height="44" rx="4" fill="#f4f9fe" stroke="#9dc8ea" /><text x="443" y="149" class="title">Task-Based</text><text x="443" y="164" class="copy">outcome state</text>
  <rect x="558" y="130" width="114" height="44" rx="4" fill="#f8f7ff" stroke="#8b8dd8" /><text x="568" y="149" class="title">Generic</text><text x="568" y="164" class="copy">quality + cost</text>
  <rect x="706" y="76" width="225" height="110" rx="6" fill="#fff" stroke="#9dc8ea" /><text x="724" y="108" class="title">Optimizer + Registry</text><text x="724" y="130" class="copy">Candidate instruction and history</text><text x="724" y="148" class="copy">Learns from evaluation results</text>

  <rect x="148" y="270" width="864" height="562" rx="10" fill="#eef5fb" fill-opacity=".55" stroke="#17212b" stroke-width="2" />
  <rect x="163" y="262" width="198" height="22" rx="3" fill="#eef5fb" /><text x="173" y="278" class="domain">ENTERPRISE DIGITAL TWIN</text>
  <rect x="190" y="294" width="780" height="242" rx="8" fill="#f8f7ff" stroke="#5b5fc7" stroke-width="2" /><text x="216" y="326" class="domain">AGENT EXECUTION LAYER</text>
  <rect x="216" y="354" width="342" height="126" rx="6" fill="#fff" stroke="#8b8dd8" stroke-width="2" /><text x="238" y="388" class="title">EDT Client SDK</text><text x="238" y="412" class="copy">Platform adapters: HTTP, Foundry, Copilot Studio, custom</text><text x="238" y="434" class="copy">Environment state providers, redaction, coordinate eval run</text>
  <rect x="602" y="354" width="342" height="126" rx="6" fill="#fff" stroke="#7da8d4" stroke-width="2" /><text x="624" y="388" class="title">Enterprise Agent Runtime</text><text x="624" y="412" class="copy">Reasoning, tools, prompt configuration, conversation</text><text x="624" y="434" class="copy">Runs user task through its native framework</text>
  <rect x="190" y="594" width="780" height="180" rx="8" fill="#f6fbf6" stroke="#107c10" stroke-width="2" /><text x="216" y="626" class="domain">ENTERPRISE ENVIRONMENT TWIN</text>
  <rect x="216" y="654" width="220" height="76" rx="6" fill="#fff" stroke="#b7d9b7" /><text x="234" y="685" class="title">Dataverse</text><text x="234" y="706" class="copy">Contacts, cases, custom entities</text>
  <rect x="470" y="654" width="220" height="76" rx="6" fill="#fff" stroke="#b7d9b7" /><text x="488" y="685" class="title">SQL / HRMS</text><text x="488" y="706" class="copy">Business records and views</text>
  <rect x="724" y="654" width="220" height="76" rx="6" fill="#fff" stroke="#b7d9b7" /><text x="742" y="685" class="title">ITSM / Git / SaaS</text><text x="742" y="706" class="copy">Tickets, access, workflows</text>

  <text x="1050" y="8" class="domain">EXTERNAL EVALUATION</text>
