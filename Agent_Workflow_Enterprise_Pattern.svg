<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title description">
  <title id="title">Enterprise Agent Readiness Platform</title>
  <desc id="description">A continuous flow from agent creation through workflow design, governance, execution, evaluation, and feedback.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fafc"/>
      <stop offset="1" stop-color="#eef4f8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#172b3a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#547386"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", sans-serif; letter-spacing: 0; }
      .eyebrow { fill: #207a73; font-size: 15px; font-weight: 700; }
      .heading { fill: #163447; font-size: 34px; font-weight: 700; }
      .subheading { fill: #526977; font-size: 17px; }
      .step { fill: #ffffff; stroke-width: 2; }
      .step-number { fill: #ffffff; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .step-title { fill: #163447; font-size: 20px; font-weight: 700; text-anchor: middle; }
      .persona { fill: #207a73; font-size: 13px; font-weight: 700; text-anchor: middle; }
      .detail { fill: #526977; font-size: 13px; text-anchor: middle; }
      .flow { fill: none; stroke: #547386; stroke-width: 3; marker-end: url(#arrow); }
      .feedback { fill: none; stroke: #d06b3c; stroke-width: 3; stroke-dasharray: 8 8; marker-end: url(#arrow); }
      .flow-label { fill: #526977; font-size: 13px; font-weight: 600; text-anchor: middle; }
      .foundation-title { fill: #ffffff; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .foundation-copy { fill: #dce9ef; font-size: 13px; text-anchor: middle; }
      @media (prefers-reduced-motion: reduce) { .pulse { display: none; } }
    </style>
  </defs>

  <rect width="1600" height="760" fill="url(#background)"/>
  <path d="M0 0H1600V9H0Z" fill="#207a73"/>

  <text x="80" y="70" class="eyebrow">ENTERPRISE DIGITAL TWIN</text>
  <text x="80" y="112" class="heading">Enterprise Agent Readiness Platform</text>
  <text x="80" y="145" class="subheading">A governed lifecycle for creating, operating, evaluating, and continuously improving enterprise agents.</text>

  <!-- Flow connectors -->
  <path id="forwardFlow" class="flow" d="M314 340H354M594 340H634M966 340H1006M1246 340H1286"/>
  <path id="feedbackFlow" class="feedback" d="M1406 475V555H194V475"/>
  <text x="800" y="585" class="flow-label">Runtime outcomes and evaluation feedback drive continuous improvement</text>

  <!-- Agent Factory -->
  <g filter="url(#shadow)">
    <rect x="74" y="220" width="240" height="255" rx="8" class="step" stroke="#2878b5"/>
    <circle cx="104" cy="250" r="18" fill="#2878b5"/>
    <text x="104" y="255" class="step-number">1</text>
    <text x="194" y="294" class="step-title">Agent Factory</text>
    <text x="194" y="323" class="persona">Agent Developers</text>
    <text x="194" y="365" class="detail">Build single and multi-agent</text>
    <text x="194" y="387" class="detail">solutions with Microsoft Agent</text>
    <text x="194" y="409" class="detail">Framework, LangGraph, or CrewAI</text>
  </g>

  <!-- Workflow Factory -->
  <g filter="url(#shadow)">
    <rect x="354" y="220" width="240" height="255" rx="8" class="step" stroke="#1f8a70"/>
    <circle cx="384" cy="250" r="18" fill="#1f8a70"/>
    <text x="384" y="255" class="step-number">2</text>
    <text x="474" y="294" class="step-title">Workflow Factory</text>
    <text x="474" y="323" class="persona">Workflow Developers</text>
    <text x="474" y="365" class="detail">Compose agents into sequential,</text>
    <text x="474" y="387" class="detail">conditional, or autonomously</text>
    <text x="474" y="409" class="detail">planned business workflows</text>
  </g>

  <!-- Evaluation -->
  <g filter="url(#shadow)">
    <rect x="634" y="220" width="332" height="255" rx="8" class="step" stroke="#c14f68"/>
    <circle cx="664" cy="250" r="18" fill="#c14f68"/>
    <text x="664" y="255" class="step-number">3</text>
    <text x="800" y="294" class="step-title">Evaluation Frameworks</text>
    <text x="800" y="323" class="persona">Data Scientists</text>
    <text x="800" y="357" class="detail">Planning • Task completion • Groundedness</text>
    <text x="800" y="381" class="detail">Policy adherence • LLM output quality</text>
    <text x="800" y="405" class="detail">Guardrails • Content safety</text>
  </g>

  <!-- Repository -->
  <g filter="url(#shadow)">
    <rect x="1006" y="220" width="240" height="255" rx="8" class="step" stroke="#5a67a8"/>
    <circle cx="1036" cy="250" r="18" fill="#5a67a8"/>
    <text x="1036" y="255" class="step-number">4</text>
    <text x="1126" y="294" class="step-title">Repository</text>
    <text x="1126" y="323" class="persona">Agent / Model Administrators</text>
    <text x="1126" y="357" class="detail">Approved agents and workflows</text>
    <text x="1126" y="379" class="detail">become governed enterprise assets</text>
    <text x="1126" y="401" class="detail">with RBAC, audit history, and</text>
    <text x="1126" y="423" class="detail">department-level token controls</text>
  </g>

  <!-- Execution Engine -->
  <g filter="url(#shadow)">
    <rect x="1286" y="220" width="240" height="255" rx="8" class="step" stroke="#bd7a22"/>
    <circle cx="1316" cy="250" r="18" fill="#bd7a22"/>
    <text x="1316" y="255" class="step-number">5</text>
    <text x="1406" y="294" class="step-title">Execution Engine</text>
    <text x="1406" y="323" class="persona">Business Users</text>
    <text x="1406" y="365" class="detail">Invoke and monitor workflows,</text>
    <text x="1406" y="387" class="detail">review business outcomes, and</text>
    <text x="1406" y="409" class="detail">provide actionable feedback</text>
  </g>

  <!-- Animated lifecycle signals -->
  <g class="pulse">
    <circle r="7" fill="#207a73">
      <animateMotion dur="5s" repeatCount="indefinite" path="M314 340H354M594 340H634M966 340H1006M1246 340H1286"/>
    </circle>
    <circle r="6" fill="#d06b3c">
      <animateMotion dur="5s" begin="2.5s" repeatCount="indefinite" path="M1406 475V555H194V475"/>
    </circle>
  </g>

  <!-- Governance foundation -->
  <rect x="74" y="640" width="1452" height="78" rx="8" fill="#163447"/>
  <text x="800" y="673" class="foundation-title">ENTERPRISE GOVERNANCE FOUNDATION</text>
  <text x="800" y="700" class="foundation-copy">Policies  •  Security standards  •  Identity and access  •  Auditability  •  Cost and token governance</text>
</svg>
